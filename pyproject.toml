[project]
name = "nganhangde"
version = "0.1.0"
description = "Ngân hàng câu hỏi và sinh đề thi LaTeX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nhd = "nganhangde.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nganhangde"]

[tool.pytest.ini_options]
testpaths = ["tests"]
