services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nhd
      POSTGRES_PASSWORD: nhd
      POSTGRES_DB: nhd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhd"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      NHD_DB: postgresql+psycopg://nhd:nhd@db/nhd
      NHD_FILES: /app/files
      # Bản sao lưu lưu ra thư mục ./backups trên máy thật (ngoài Docker)
      NHD_BACKUPS: /app/backups
      # Khoá Claude API để sinh câu hỏi trực tiếp (đặt trong file .env cạnh file này); bỏ trống thì dùng cách chép prompt
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NHD_MODEL: ${NHD_MODEL:-claude-opus-5-5}
    # Chưa có đăng nhập nên chỉ mở cho máy này
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./out:/app/out
      - files:/app/files
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  files:
